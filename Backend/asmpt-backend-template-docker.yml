#template for backend pipeline

steps:
  - script: |
      echo 'hellow docker hub'
    displayName: 'first script'

  - task: Docker@2
    displayName: 'build and push image to docker hub'
    inputs:
      command: 'buildAndPush'
      repository: 'frotalucas/asmpt-backend-image'
      Dockerfile: 'Backend/Dockerfile'
      containerRegistry: 'dockerhub-connection'
      tags: |
        $(Build.BuildId)