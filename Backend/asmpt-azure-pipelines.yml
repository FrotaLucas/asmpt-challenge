

#new pipelinee

trigger: 
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  solutionPath: 'Backend/asmpt-challenge.sln'
  buildConfiguration: 'Release'

steps:

  - script: |
      echo 'hellow'
    displayName: 'first script'

  - script: |
      echo 'restore'
    displayName: 'restore all dependencies'


#1. Restaura as dependências
  - task: DotNetCoreCLI@2
    displayName: 'task restore NET dependencies'
    inputs:
      command: restore
      projects: '$(solutionPath)'

# 2. Compila a aplicação
  - task: DotNetCoreCLI@2
    displayName: 'Build solution'
    inputs:
      command: build
      projects: '$(solutionPath)'
      arguments: '--configuration $(buildConfiguration)'

#3 Tests

  - script: dotnet test Backend/tests --configuration $(buildConfiguration) --no-build --verbosity normal
    displayName: 'run tests'