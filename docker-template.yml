parameters:
  - name: repositoryName
    type: string

  - name: dockerhubConnectionName
    type: string

  - name: dockerfilePath
    type: string

steps:
  - script: |
      echo 'hellow docker hub'
    displayName: 'first script'

  - task: Docker@2
    displayName: 'build and push image to docker hub'
    inputs: 
      command: 'buildAndPush'
      respository: '{{parameters.repositoryName}}'
      dockerFile: '{{parameters.dockerfilePath}}'
      containerRegistry: '{{parameters.dockerhubConnectionName}}'
      tags: |
        latest
        $(Build.BuildId)