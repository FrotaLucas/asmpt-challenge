
trigger:
- main

variables:
  - group: 'new-variable-group'
  - group: 'swp-variable-group'


pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self

  - script: |
      echo "1 group of variables"
      echo "show content of value1 $(value1)" 
    displayName: Script with Library Test

  - script: |
      echo "2 group of variable"
      echo "test swp token $(azure-swp-token)"
    displayName: Script Token Test

  - task: AzureStaticWebApp@0
    displayName: SWP task
    inputs:
      app_location: '/Frontend'
      output_location: 'dist/smt-order-management'
      azure_static_web_apps_api_token: $(azure-swp-token)
