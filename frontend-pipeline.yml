
trigger:
- main

variables:
  group: 'swp-variable-group'


pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self

  - script: |
      echo "Hellow"
      echo "test group variable $(swp-variable-group)"
      echo "test swp token $(azure-swp-token)"
    displayName: Script Test

  - task: AzureStaticWebApp@0
    displayName: SWP task
    inputs:
      app_location: '/Frontend'
      output_location: 'dist/smt-order-management'
      azure_static_web_apps_api_token: $(azure-swp-token)
