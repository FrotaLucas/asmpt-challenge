#pipeline Frontend

#AO APROVAR UM MERGE OS 3 PIPELINES SAO TRIGADOS E PARACE QUE ACONTECE EM PARALELO
#GARANTIR EXECUCAO EM SERIE E NAO EM PARALELO

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - Frontend/*
    exclude:
      - '**/*.yml'

pool:
  vmImage: 'ubuntu-latest'

variables:
  frontendPath: 'Frontend'

steps:
  - task: UseNode@1
    displayName: Install Node.js
    inputs:
      version: '20.x'

  - task: Npm@1
    displayName: 'Install Dependencies'
    inputs:
      command: install
      workingDir: '$(frontendPath)'

  - task: Npm@1
    displayName: 'Build Frontend'
    inputs:
      command: custom
      workingDir: '$(frontendPath)'
      customCommand: 'run build'
