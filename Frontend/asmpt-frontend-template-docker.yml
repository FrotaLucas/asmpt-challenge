

steps:

  - script: |
      echo 'hellow dockerhub'
    displayName: 'first script'

  - task: Docker@2
    displayName: 'build and push image to docker hub'
    inputs:
      command: 'buildAndPush'
      repository: 'frotalucas/asmpt-frontend-image'
      Dockerfile: 'Frontend/Dockerfile'
      containerRegistry: 'dockerhub-connection'
      tags: |
        latest
        $(Build.BuildId)